<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>O'quvchi Paneli - Test Yechish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>O'quvchi Kabineti</h2>
        <button onclick="localStorage.clear(); window.location.href='/'" class="btn btn-danger">Chiqish</button>
    </div>

    <div id="quizContainer">
        <button onclick="loadQuizzes()" class="btn btn-primary mb-3">Testlarni Yuklash</button>
    </div>
</div>

<script>
    let userAnswers = {};
    let quizData = [];

    async function loadQuizzes() {
        const res = await fetch('/api/quizzes');
        const data = await res.json();
        quizData = data.quizzes;

        let html = '';
        if (quizData.length === 0) {
            html = `<p>Hali testlar qo'shilmagan.</p>`;
        } else {
            quizData.forEach((q, index) => {
                html += `
                <div class="card p-3 mb-3 shadow-sm">
                    <h5>${index + 1}. ${q.question} <span class="badge bg-secondary">${q.title}</span></h5>
                    <div class="form-check"><input class="form-check-input" type="radio" name="q_${q.id}" value="A" onclick="userAnswers[${q.id}]='A'"> A) ${q.option_a}</div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="q_${q.id}" value="B" onclick="userAnswers[${q.id}]='B'"> B) ${q.option_b}</div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="q_${q.id}" value="C" onclick="userAnswers[${q.id}]='C'"> C) ${q.option_c}</div>
                    <div class="form-check"><input class="form-check-input" type="radio" name="q_${q.id}" value="D" onclick="userAnswers[${q.id}]='D'"> D) ${q.option_d}</div>
                </div>`;
            });
            html += `<button onclick="submitQuiz()" class="btn btn-success btn-lg w-100">Testni Yakunlash</button>`;
        }
        document.getElementById('quizContainer').innerHTML = html;
    }

    function submitQuiz() {
        let score = 0;
        quizData.forEach(q => {
            if (userAnswers[q.id] === q.correct_option) {
                score++;
            }
        });
        alert(`Test yakunlandi! Natijangiz: ${quizData.length} ta savoldan ${score} ta to'g'ri topdingiz.`);
    }

    loadQuizzes();
</script>
</body>
</html>
