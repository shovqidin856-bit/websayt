<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'quvchi Kabineti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(90deg, #1e1b4b 0%, #312e81 100%); }
        .quiz-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .quiz-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-graduation-cap me-2"></i>O'quvchi Paneli</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light fw-medium" id="userName">O'quvchi</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-right-from-bracket me-1"></i>Chiqish</button>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row mb-4">
        <div class="col">
            <h3 class="fw-bold text-dark">Mavjud Testlar</h3>
            <p class="text-muted">Bilimingizni sinash uchun testni tanlang va yeching.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-4">
            <div class="card quiz-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">Matematika</span>
                    <small class="text-muted"><i class="fa-regular fa-clock me-1"></i>20 daqiqa</small>
                </div>
                <h5 class="fw-bold text-dark mb-2">Algebra va Tenglamalar</h5>
                <p class="text-muted small mb-4">Chiziqli va kvadrat tenglamalarni yechish bo'yicha 10 ta test savoli.</p>
                <button class="btn btn-primary w-100 rounded-3 fw-semibold"><i class="fa-solid fa-play me-2"></i>Testni Boshlash</button>
            </div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = '/';
    else document.getElementById('userName').innerText = user.name;

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }
</script>
</body>
</html>
