<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>O'qituvchi Paneli - Test Yaratish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>O'qituvchi Kabineti</h2>
        <button onclick="localStorage.clear(); window.location.href='/'" class="btn btn-danger">Chiqish</button>
    </div>

    <div class="card p-4 shadow-sm">
        <h4>Yangi Test Savoli Qo'shish</h4>
        <form id="quizForm" onsubmit="addQuiz(event)">
            <div class="mb-3">
                <label>Mavzu Nomlanishi</label>
                <input type="text" id="title" class="form-control" required placeholder="Masalan: Tenglamalar">
            </div>
            <div class="mb-3">
                <label>Savol matni</label>
                <input type="text" id="question" class="form-control" required placeholder="Masalan: 2 + 2 * 2 = ?">
            </div>
            <div class="row g-2 mb-3">
                <div class="col-6"><input type="text" id="optA" class="form-control" placeholder="A variant" required></div>
                <div class="col-6"><input type="text" id="optB" class="form-control" placeholder="B variant" required></div>
                <div class="col-6"><input type="text" id="optC" class="form-control" placeholder="C variant" required></div>
                <div class="col-6"><input type="text" id="optD" class="form-control" placeholder="D variant" required></div>
            </div>
            <div class="mb-3">
                <label>To'g'ri variantni tanlang</label>
                <select id="correct" class="form-select">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Testni Bazaga Saqlash</button>
        </form>
    </div>
</div>

<script>
    async function addQuiz(e) {
        e.preventDefault();
        const data = {
            title: document.getElementById('title').value,
            question: document.getElementById('question').value,
            a: document.getElementById('optA').value,
            b: document.getElementById('optB').value,
            c: document.getElementById('optC').value,
            d: document.getElementById('optD').value,
            correct: document.getElementById('correct').value
        };

        const res = await fetch('/api/quizzes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        alert(result.message);
        if (result.success) document.getElementById('quizForm').reset();
    }
</script>
</body>
</html>
