<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'qituvchi Paneli - Test va Reyting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .badge-rank { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-3 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold fs-6" href="#"><i class="fa-solid fa-chalkboard-user me-2"></i>O'qituvchi Paneli</a>
        <div class="d-flex align-items-center gap-2">
            <span class="text-light small" id="userName">O'qituvchi</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>
</nav>

<div class="container my-4">
    <!-- Navigatsiya tablari -->
    <ul class="nav nav-pills nav-fill mb-4 bg-white p-2 rounded-3 shadow-sm" id="teacherTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-semibold" id="create-tab" data-bs-toggle="tab" data-bs-target="#create" type="button"><i class="fa-solid fa-plus-circle me-2"></i>Test Yaratish</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-semibold" id="rank-tab" data-bs-toggle="tab" data-bs-target="#rank" type="button" onclick="loadLeaderboard()"><i class="fa-solid fa-trophy me-2 text-warning"></i>O'quvchilar Reytingi</button>
        </li>
    </ul>

    <div class="tab-content" id="teacherTabContent">
        <!-- TEST YARATISH BO'LIMI -->
        <div class="tab-pane fade show active" id="create" role="tabpanel">
            <div class="card card-custom p-4 bg-white">
                <h4 class="fw-bold mb-4 text-dark"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Yangi Test Savoli Qo'shish</h4>
                <form id="quizForm" onsubmit="addQuiz(event)">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Mavzu Nomlanishi</label>
                        <input type="text" id="title" class="form-control rounded-3" required placeholder="Masalan: Tenglamalar">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Savol matni</label>
                        <input type="text" id="question" class="form-control rounded-3" required placeholder="Masalan: 2 + 2 * 2 = ?">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6"><input type="text" id="optA" class="form-control rounded-3" placeholder="A variant" required></div>
                        <div class="col-6"><input type="text" id="optB" class="form-control rounded-3" placeholder="B variant" required></div>
                        <div class="col-6"><input type="text" id="optC" class="form-control rounded-3" placeholder="C variant" required></div>
                        <div class="col-6"><input type="text" id="optD" class="form-control rounded-3" placeholder="D variant" required></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">To'g'ri variantni tanlang</label>
                        <select id="correct" class="form-select rounded-3">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-3 fw-semibold"><i class="fa-solid fa-floppy-disk me-2"></i>Testni Bazaga Saqlash</button>
                </form>
            </div>
        </div>

        <!-- REYTING BO'LIMI -->
        <div class="tab-pane fade" id="rank" role="tabpanel">
            <div class="card card-custom p-4 bg-white">
                <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-chart-line text-success me-2"></i>O'quvchilar Natijalari</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>O'quvchi Ismi</th>
                                <th>Test Mavzusi</th>
                                <th>To'plangan Ball</th>
                                <th>Sana</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboardBody">
                            <tr><td colspan="5" class="text-center text-muted">Yuklanmoqda...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'teacher') window.location.href = '/';
    else document.getElementById('userName').innerText = user.name;

    function logout() { localStorage.clear(); window.location.href = '/'; }

    async function addQuiz(e) {
        e.preventDefault();
        const data = {
            title: document.getElementById('title').value,
            question: document.getElementById('question').value,
            a: document.getElementById('optA').value,
            b: document.getElementById('optB').value,
            c: document.getElementById('optC').value,
            d: document.getElementById('optD').value,
            correct: document.getElementById('correct').value
        };

        const res = await fetch('/api/quizzes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        alert(result.message);
        if (result.success) document.getElementById('quizForm').reset();
    }

    async function loadLeaderboard() {
        const res = await fetch('/api/leaderboard');
        const data = await res.json();
        let rows = '';
        data.leaderboard.forEach((item, index) => {
            let badgeClass = 'bg-secondary text-white';
            if(index === 0) badgeClass = 'bg-warning text-dark';
            else if(index === 1) badgeClass = 'bg-light text-dark border';
            else if(index === 2) badgeClass = 'bg-danger text-white';

            const date = new Date(item.created_at).toLocaleString('uz-UZ');

            rows += `
                <tr>
                    <td><span class="badge-rank ${badgeClass}">${index + 1}</span></td>
                    <td class="fw-semibold">${item.user_name}</td>
                    <td><span class="badge bg-info text-dark">${item.quiz_title}</span></td>
                    <td><span class="fw-bold text-success">${item.score}</span> / ${item.total}</td>
                    <td class="text-muted small">${date}</td>
                </tr>
            `;
        });
        document.getElementById('leaderboardBody').innerHTML = rows || `<tr><td colspan="5" class="text-center">Hali hech kim test topshirmadi.</td></tr>`;
    }
</script>
</body>
</html>
