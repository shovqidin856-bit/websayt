<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'qituvchi Kabineti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%); }
        .dashboard-card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-chalkboard-user me-2"></i>O'qituvchi Paneli</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light fw-medium" id="userName">O'qituvchi</span>
            <button onclick="logout()" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-right-from-bracket me-1"></i>Chiqish</button>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card dashboard-card p-4 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary text-white p-3 rounded-circle"><i class="fa-solid fa-users fa-xl"></i></div>
                    <div>
                        <h6 class="text-muted mb-0">Jami O'quvchilar</h6>
                        <h3 class="fw-bold mb-0">24 nafar</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card p-4 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-success text-white p-3 rounded-circle"><i class="fa-solid fa-file-circle-check fa-xl"></i></div>
                    <div>
                        <h6 class="text-muted mb-0">Yaratilgan Testlar</h6>
                        <h3 class="fw-bold mb-0">8 ta</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Yangi Test Yaratish -->
    <div class="card dashboard-card p-4 bg-white">
        <h4 class="fw-bold mb-4 text-dark"><i class="fa-solid fa-plus-circle text-primary me-2"></i>Yangi Test Yaratish</h4>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-medium">Test Nomlanishi</label>
                <input type="text" class="form-control rounded-3" placeholder="Masalan: Geometriya 1-qism">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium">Vaqt (daqiqa)</label>
                <input type="number" class="form-control rounded-3" placeholder="15">
            </div>
            <div class="col-12 mt-4">
                <button class="btn btn-primary rounded-3 px-4 fw-semibold"><i class="fa-solid fa-floppy-disk me-2"></i>Saqlash</button>
            </div>
        </div>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'teacher') window.location.href = '/';
    else document.getElementById('userName').innerText = user.name;

    function logout() {
        localStorage.clear();
        window.location.href = '/';
    }
</script>
</body>
</html>
