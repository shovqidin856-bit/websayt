<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matematika Test Platformasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            padding: 12px 15px;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .btn-custom {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
        }
        .toggle-link {
            color: #a855f7;
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }
        .toggle-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <!-- Kirish Forma -->
    <div id="loginForm">
        <div class="text-center mb-4">
            <i class="fa-solid fa-square-root-variable fa-3x text-info mb-2"></i>
            <h3 class="fw-bold">Tizimga kirish</h3>
            <p class="text-secondary">Matematika Test Platformasi</p>
        </div>
        <div class="mb-3">
            <label class="form-label"><i class="fa-solid fa-user me-2"></i>Login</label>
            <input type="text" id="loginUsername" class="form-control" placeholder="Loginni kiriting">
        </div>
        <div class="mb-4">
            <label class="form-label"><i class="fa-solid fa-lock me-2"></i>Parol</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Parolni kiriting">
        </div>
        <button onclick="login()" class="btn btn-custom w-100 mb-3">Kirish</button>
        <p class="text-center text-secondary mb-0">
            Akkountingiz yo'qmi? <span class="toggle-link" onclick="toggleAuth('register')">Ro'yxatdan o'tish</span>
        </p>
    </div>

    <!-- Ro'yxatdan o'tish Forma -->
    <div id="registerForm" class="d-none">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-plus fa-3x text-warning mb-2"></i>
            <h3 class="fw-bold">Ro'yxatdan o'tish</h3>
            <p class="text-secondary">O'quvchi profilini yaratish</p>
        </div>
        <div class="mb-3">
            <label class="form-label"><i class="fa-solid fa-id-card me-2"></i>Ism va Familiya</label>
            <input type="text" id="regName" class="form-control" placeholder="Ismingizni kiriting">
        </div>
        <div class="mb-3">
            <label class="form-label"><i class="fa-solid fa-user me-2"></i>Yangi Login</label>
            <input type="text" id="regUsername" class="form-control" placeholder="Login tanlang">
        </div>
        <div class="mb-4">
            <label class="form-label"><i class="fa-solid fa-lock me-2"></i>Parol</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Parol kiriting">
        </div>
        <button onclick="register()" class="btn btn-custom w-100 mb-3">Ro'yxatdan o'tish</button>
        <p class="text-center text-secondary mb-0">
            Akkauntingiz bormi? <span class="toggle-link" onclick="toggleAuth('login')">Kirish</span>
        </p>
    </div>
</div>

<script>
    function toggleAuth(type) {
        if (type === 'register') {
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('registerForm').classList.remove('d-none');
        } else {
            document.getElementById('registerForm').classList.add('d-none');
            document.getElementById('loginForm').classList.remove('d-none');
        }
    }

    async function login() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) return alert("Barcha maydonlarni to'ldiring!");

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
            localStorage.setItem('user', JSON.stringify(data.user));
            if (data.user.role === 'teacher') {
                window.location.href = '/teacher.html';
            } else {
                window.location.href = '/student.html';
            }
        } else {
            alert(data.message);
        }
    }

    async function register() {
        const name = document.getElementById('regName').value;
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;

        if (!name || !username || !password) return alert("Barcha maydonlarni to'ldiring!");

        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, username, password })
        });
        const data = await res.json();

        alert(data.message);
        if (data.success) toggleAuth('login');
    }
</script>
</body>
</html>
